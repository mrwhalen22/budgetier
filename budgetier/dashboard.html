const TOUR = [
  ["#addFiles", "Add more history", "Choose CSV exports or a Synchrony PDF any time. You check everything on a review screen before it's saved."],
  ["#bankBtn", "Keep accounts up to date", "Connect your banks through SimpleFIN, or sync the ones you've connected. Budgetier also syncs when it opens."],
  ['[data-tab="Overview"]', "See the big picture", "Spending, income and how much of each dollar you keep, by month."],
  ['[data-tab="Budgets"]', "Set monthly budgets", "Give a category a target, in dollars or as a percent of income, and see what's left each month."],
  ['[data-tab="Recurring"]', "Spot regular bills", "Subscriptions and repeat payments are found automatically."],
  ['[data-tab="Rules"]', "Teach it your merchants", "Give unknown purchases a name and category. It applies to all your history and future imports."],
  ['[data-tab="Accounts"]', "Manage your accounts", "Manage bank sync, set card balances, remove files or accounts, and export to Excel."],
  ['[data-tab="Help"]', "Find help any time", "See which banks work and how to get the most accurate numbers."],
];
function endTour() {
  document.getElementById("spot")?.remove(); document.getElementById("coach")?.remove();
  try { localStorage.setItem("budgetier-toured", "1"); } catch {}
}
function tour(n = 0) {
  const step = TOUR[n]; if (!step) return endTour();
  const el = document.querySelector(step[0]);
  if (!el || !el.offsetParent) return tour(n + 1);
  let spot = document.getElementById("spot"), coach = document.getElementById("coach");
  if (!spot) { spot = document.createElement("div"); spot.id = "spot"; document.body.append(spot); coach = document.createElement("div"); coach.id = "coach"; coach.setAttribute("role", "dialog"); document.body.append(coach); }
  const r = el.getBoundingClientRect(), pad = 5;
  Object.assign(spot.style, {left: r.left - pad + "px", top: r.top - pad + "px", width: r.width + pad * 2 + "px", height: r.height + pad * 2 + "px"});
  coach.innerHTML = `<h3>${step[1]}</h3><p>${step[2]}</p><div class="row"><span class="count">${n + 1} of ${TOUR.length}</span><button class="btn small" data-tour="end">Skip</button><button class="btn small primary" data-tour="${n + 1}">${n + 1 === TOUR.length ? "Done" : "Next"}</button></div>`;
  const narrow = innerWidth < 880;
  coach.style.left = (narrow ? 16 : Math.min(r.right + 16, innerWidth - 356)) + "px";
  coach.style.top = (narrow ? Math.min(r.bottom + 14, innerHeight - 190) : Math.min(r.top, innerHeight - 190)) + "px";
}
function maybeTour() {
  if (!TX.length || !document.body.classList.contains("in-app")) return;
  try { if (localStorage.getItem("budgetier-toured")) return; } catch { return; }
  setTimeout(() => tour(), 500);
}

/* ---------- desktop app ---------- */
// Everything here needs the app's bridge; opened in a browser, the page stays read-only.
const modal = document.getElementById("modal");
const api = () => window.pywebview.api;
// Lives outside the app's bridge: the look works in a plain browser too.
function appearance() {
  const pressed = on => `aria-pressed="${on}"`, mode = Look.mode;
  showModal("Appearance", "This computer remembers your choice.", `<div class="choice-label">Mode</div>
    <div class="segments">${[["system", "Match system"], ["light", "Light"], ["dark", "Dark"]].map(([v, n]) => `<button type="button" data-look-mode="${v}" ${pressed(v === mode)}>${n}</button>`).join("")}</div>
    <div class="choice-label">Theme</div>
    <div class="swatches">${PALETTES.map(([v, n]) => `<button type="button" class="swatch" data-look-palette="${v}" data-palette="${v}" data-mode="${document.documentElement.dataset.mode}" ${pressed(v === Look.palette)}><i></i>${n}</button>`).join("")}</div>`,
    '<button class="btn primary" data-modal="close">Done</button>');
}
function setLook(change) {
  Object.assign(Look, change);
  try { localStorage.setItem(LOOK_KEY, JSON.stringify(Look)); localStorage.removeItem("budgetier-theme"); } catch {}
  applyLook();
  appearance();
}
function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = "none", 5000);
}
function showModal(title, sub, body, foot) {
  if (document.getElementById("coach")) endTour();
  modal.innerHTML = `<div class="modal"><div class="modal-head"><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ""}</div><div class="modal-body">${body}</div><div class="modal-foot"><span class="msg" id="modalMsg"></span>${foot}</div></div>`;
  if (!modal.open) modal.showModal();
}
const modalError = text => { document.getElementById("modalMsg").textContent = text; };
const closeModal = () => modal.close();

// A note that stays up until the work is done, for steps that can take a while.
function progress(text) {
  const t = document.getElementById("toast");
  clearTimeout(toast.timer);
  t.textContent = text; t.style.display = text ? "block" : "none";
}
// The button can't be pressed twice, and says what's happening if the work is slow.
async function hold(button, label, work) {
  const text = button.textContent;
  button.disabled = true; button.textContent = label;
  try { await work(); } finally { button.disabled = false; button.textContent = text; }
}

// Saving redraws the page from new data, so what you were looking at is carried across.
/* ---------- bank sync ---------- */
function syncCard() {
  const s = D.sync;
  if (!s) return "";
  if (!s.connected) return `<div class="card app-only"><h2>Bank sync</h2><p class="sub">Update accounts automatically through SimpleFIN instead of downloading files. SimpleFIN and the services behind it handle your transactions, so they no longer stay only on this computer.</p><div class="tools inset app-only"><button class="btn" data-act="bank-connect">Connect SimpleFIN</button></div></div>`;
  const when = syncedAt() || "not yet";
  const noAccounts = !s.linked.length;
  return `<div class="card app-only"><h2>Bank sync</h2><p class="sub">Connected through SimpleFIN. Last synced ${esc(when)}.${s.linked.length ? ` Updating ${esc(s.linked.join(", "))}.` : " No accounts chosen yet."}</p>
    ${s.problems.map(p => `<div class="banner warn">${esc(p)}</div>`).join("")}
    ${s.unlinked ? `<div class="banner warn">SimpleFIN has ${s.unlinked} account${s.unlinked === 1 ? "" : "s"} you haven't chosen yet.</div>` : ""}
    <div class="tools inset app-only">${noAccounts ? "" : '<button class="btn primary" data-act="bank-sync">Sync now</button>'}<button class="btn${noAccounts ? " primary" : ""}" data-act="bank-review">Choose accounts</button><button class="btn" data-act="bank-disconnect">Disconnect</button></div></div>`;
}
const syncedAt = () => D.sync && D.sync.lastSync ? new Date(D.sync.lastSync).toLocaleString("en-US", {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}) : "";
function paintBankButton() {
  const b = document.getElementById("bankBtn"), s = D.sync;
  if (!s) return b.remove();
  b.textContent = !s.connected ? "Connect SimpleFIN" : s.linked.length ? "Sync now" : "Choose accounts";
  b.title = s.connected && s.lastSync ? `Last synced ${syncedAt()}` : "";
}
function bankAction(button) {
  if (!D.sync.connected) return connectBankForm();
  return D.sync.linked.length ? hold(button, "Syncing...", syncNow) : hold(button, "Checking...", openBankReview);
}
function connectBankForm() {
  showModal("Connect SimpleFIN", "Paste the setup token from your SimpleFIN account. It only works once.", `<label class="field">Setup token<input id="sToken" type="password" autocomplete="off" spellcheck="false" autofocus></label>
    <p class="dim">Budgetier keeps this connection in this computer's secure storage. It can read your transactions and balances, but can't move money. SimpleFIN and the services behind it will handle your transactions.</p>`,
    '<button class="btn" data-modal="close">Cancel</button><button class="btn primary" data-modal="bank-connect">Connect</button>');
  document.getElementById("sToken").onkeydown = e => { if (e.key === "Enter") modal.querySelector("[data-modal=bank-connect]").click(); };
}
async function connectBank() {
  const done = await api().connect_bank(document.getElementById("sToken").value);
  if (!done.ok) return modalError(done.error);
  reviewBank(done, true);
}
async function openBankReview() {
  const plan = await api().review_bank();
  if (!plan.ok) return toast(plan.error);
  reviewBank(plan);
}
function reviewBank(plan, justConnected = false) {
  const choices = a => [...plan.existing.map(x => [x.id, x.name]), ["", "New account"], ["skip", "Don't sync"]]
    .map(([v, n]) => `<option value="${esc(v)}"${v === (a.skipped ? "skip" : a.account) ? " selected" : ""}>${esc(n)}</option>`).join("");
  const card = a => `<section class="panel" data-key="${esc(a.key)}"><h3>${esc(a.bank)}: ${esc(a.name)}</h3>
    <div class="sub">Balance ${cents(a.balance)}${a.currency === "USD" ? "" : " " + esc(a.currency)}, ${a.count.toLocaleString()} recent transactions</div>
    ${a.currency === "USD" ? `<div class="fields"><label class="field">Add to<select name="link">${choices(a)}</select></label></div>
    <div class="fields" data-new${a.account || a.skipped ? " hidden" : ""}>
      <label class="field">Bank<input name="bank" value="${esc(a.bank)}" autocomplete="off"></label>
      <label class="field">Last 4 digits, optional<input name="number" value="${esc(a.number)}" maxlength="4" inputmode="numeric" autocomplete="off"></label>
      <label class="field">Type<select name="type">${TYPE_NAMES.map(([v, n]) => `<option value="${v}"${v === a.type ? " selected" : ""}>${n}</option>`).join("")}</select></label>
    </div>` : `<div class="sub">Only US dollar accounts can sync, so this one is skipped.</div>`}</section>`;
  const bad = plan.problems.map(p => `<div class="banner warn">${esc(p)}</div>`).join("");
  const empty = plan.problems.length ? "" : "<p>SimpleFIN didn't send any accounts yet. Check the banks connected on your SimpleFIN account.</p>";
  showModal("Choose accounts", plan.accounts.length ? (plan.existing.length ? "Match each bank account to one here, or add it as new. History you've already imported stays, and syncing adds what's newer." : "Check each account, then save. You can change this later.") : "", bad + (plan.accounts.map(card).join("") || empty),
    `<button class="btn" data-modal="${justConnected ? "reload" : "close"}">${plan.accounts.length ? "Cancel" : "Close"}</button>${plan.accounts.length ? '<button class="btn primary" data-modal="bank-link">Save</button>' : ""}`);
  modal.querySelectorAll("[name=link]").forEach(pick => { pick.onchange = () => { pick.closest(".panel").querySelector("[data-new]").hidden = pick.value !== ""; }; });
}
async function linkBank() {
  const value = (box, n) => { const f = box.querySelector(`[name=${n}]`); return f ? f.value : ""; };
  const choices = [...modal.querySelectorAll("[data-key]")].map(box => ({key: box.dataset.key, name: box.querySelector("h3").textContent, account: box.querySelector("[name=link]") ? value(box, "link") : "skip", bank: value(box, "bank"), number: value(box, "number"), type: value(box, "type")}));
  const done = await api().link_bank(choices);
  if (!done.ok) return modalError(done.error);
  showModal("Accounts saved", done.results.length ? "SimpleFIN usually brings in about the last 90 days. To go further back, add CSV exports. Overlapping days aren't counted twice." : "", (done.results.map(r => `<div class="done-row"><span>${esc(r.account)}</span><span class="dim">${r.added.toLocaleString()} new</span></div>`).join("") || "<p>No accounts are syncing.</p>"),
    '<button class="btn primary" data-modal="reload">Done</button>');
}
async function syncNow() {
  const done = await api().sync_bank(false);
  if (!done.ok) return toast(done.error);
  if (done.skipped) return toast("Synced a moment ago, so there's nothing new yet.");
  if (done.added) return reload(syncNote(done.added));
  reload(done.problems.length || done.unlinked ? "Synced. See Bank sync on the Accounts tab." : "Everything's up to date.");
}
const syncNote = n => `Synced: ${n.toLocaleString()} new transaction${n === 1 ? "" : "s"}.`;
async function autoSync() {
  if (!D.sync || !D.sync.connected) return;
  if (!D.sync.linked.length) return;
  const button = document.getElementById("bankBtn");
  await hold(button, "Syncing...", async () => {
    const done = await api().sync_bank(true);
    if (!done.ok) return toast(done.error);
    if (done.added) { if (modal.open) toast(syncNote(done.added)); else reload(syncNote(done.added)); }
  });
}

const VIEW_KEY = "budgetier-view", VIEW_FIELDS = ["range", "txq", "txcat", "txkind", "txsort", "txdir", "txshow", "recAll"];
function reload(note = "") {
  const view = Object.fromEntries(VIEW_FIELDS.map(k => [k, S[k]]));
  view.y = scrollY;
  view.note = note;
  if (S.accts.size < D.accounts.length) view.accts = D.accounts.filter(a => S.accts.has(a.index)).map(a => a.id);
  try { sessionStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch {}
  location.reload();
}
function restoreView() {
  let view;
  try { view = JSON.parse(sessionStorage.getItem(VIEW_KEY)); sessionStorage.removeItem(VIEW_KEY); } catch {}
  if (!view) return null;
  VIEW_FIELDS.forEach(k => { S[k] = view[k]; });
  if (view.accts) S.accts = new Set(D.accounts.filter(a => view.accts.includes(a.id)).map(a => a.index));
  return view;
}

async function addFiles() {
  const picked = await api().pick_files();
  if (!picked.ok) return toast(picked.error);
  if (!picked.paths.length) return;
  progress(`Reading ${picked.paths.length === 1 ? "your file" : `${picked.paths.length} files`}...`);
  const plan = await api().inspect(picked.paths);
  progress("");
  if (!plan.ok) return toast(plan.error);
  reviewImport(plan);
}
const TYPE_NAMES = [["checking", "Checking"], ["savings", "Savings"], ["credit", "Credit card"]];
function reviewImport(plan) {
  const card = i => `<section class="panel" data-item="${esc(i.id)}"><h3>${esc(i.file)}</h3>
    <div class="sub">${i.count.toLocaleString()} transactions, ${dName(i.first)} to ${dName(i.last)}${i.known ? ` · adds to ${esc(i.accountName)}: ${i.new.toLocaleString()} new, ${(i.count - i.new).toLocaleString()} already here` : " · new account"}</div>
    ${i.notes.map(n => `<div class="sub">${esc(n)}</div>`).join("")}
    <div class="fields">
      <label class="field">Bank<input name="bank" value="${esc(i.bank)}" placeholder="Bank name" autocomplete="off"></label>
      <label class="field">Last 4 digits<input name="number" value="${esc(i.number)}" maxlength="4" inputmode="numeric" autocomplete="off"></label>
      <label class="field">Type<select name="type"${i.known ? " disabled" : ""}>${TYPE_NAMES.map(([v, n]) => `<option value="${v}"${v === i.type ? " selected" : ""}>${n}</option>`).join("")}</select></label>
      ${i.known || i.hasBalance ? "" : `<label class="field">Current balance, optional<input name="balance" placeholder="For a card, what you owe" autocomplete="off"></label>`}
    </div>
    ${i.askSign ? `<div class="ask">This file shows <b>${esc(i.sample.description)}</b> on ${dName(i.sample.date)} as <b>${cents(i.sample.amount)}</b>. Was that money you spent?<br>
      <label><input type="radio" name="spent-${esc(i.id)}" value="yes"${i.spent ? " checked" : ""}> Yes</label><label><input type="radio" name="spent-${esc(i.id)}" value="no"${i.spent ? "" : " checked"}> No</label></div>` : ""}
  </section>`;
  const bad = plan.errors.map(e => `<div class="banner warn"><b>${esc(e.file)}</b> couldn't be added: ${esc(e.error)}</div>`).join("");
  const n = plan.items.length;
  showModal("Review files", n ? "Check the details. Nothing is saved until you choose Add files." : "", bad + plan.items.map(card).join(""),
    `<button class="btn" data-modal="cancel">${n ? "Cancel" : "Close"}</button>${n ? '<button class="btn primary" data-modal="import">Add files</button>' : ""}`);
  modal.dataset.items = JSON.stringify(plan.items.map(i => i.id));
}
async function runImport(button) {
  const answers = JSON.parse(modal.dataset.items).map(id => {
    const box = modal.querySelector(`[data-item="${id}"]`), val = n => { const f = box.querySelector(`[name=${n}]`); return f ? f.value : ""; };
    const spent = box.querySelector(`[name="spent-${id}"]:checked`);
    return {id, bank: val("bank"), number: val("number"), type: val("type"), balance: val("balance"), spent: spent ? spent.value === "yes" : null};
  });
  const done = await api().commit(answers);
  if (!done.ok) return modalError(done.error);
  showModal("Files added", "", done.results.map(r => `<div class="done-row"><span>${esc(r.account)}</span><span class="dim">${r.added.toLocaleString()} new, ${r.duplicates.toLocaleString()} already here</span></div>`).join(""),
    '<button class="btn primary" data-modal="reload">Done</button>');
}
function confirmRemove(title, body, run, action = "Remove") {
  showModal(title, "", `<p>${esc(body)}</p>`, `<button class="btn" data-modal="close">Cancel</button><button class="btn danger" data-modal="confirm">${action}</button>`);
  modal.onConfirm = run;
}
async function removal(call) {
  const done = await call;
  if (!done.ok) return modalError(done.error);
  reload();
}
function editAccount(id) {
  const a = D.accounts.find(x => x.id === id), owed = a.type === "credit";
  const current = a.calculated ? Math.abs(a.balance).toFixed(2) : "";
  showModal(`Edit ${a.name}`, "", `<div class="fields">
      <label class="field">Name<input id="eName" value="${esc(a.name)}" autocomplete="off"></label>
      <label class="field">Type<select id="eType">${TYPE_NAMES.map(([v, n]) => `<option value="${v}"${v === a.type ? " selected" : ""}>${n}</option>`).join("")}</select></label>
      ${a.calculated || a.balance === null ? `<label class="field">${owed ? "Amount owed" : "Balance"}<input id="eBalance" value="${current}" placeholder="From the bank's website" autocomplete="off"></label>
      <label class="field">As of<input id="eDate" type="date" value="${new Date().toLocaleDateString("en-CA")}"></label>` : ""}
    </div>`, '<button class="btn" data-modal="close">Cancel</button><button class="btn primary" data-modal="save">Save</button>');
  modal.dataset.account = id;
}
async function saveAccount() {
  const v = id => { const f = document.getElementById(id); return f ? f.value : ""; };
  const done = await api().update_account(modal.dataset.account, v("eName"), v("eType"), v("eBalance"), v("eDate"));
  if (!done.ok) return modalError(done.error);
  reload();
}
function initApp() {
  const ready = () => {
    document.body.classList.add("in-app");
    document.getElementById("addFiles").innerHTML = `${icon(PLUS)}Add files`;
    paintBankButton();
    render();
    maybeTour();
    autoSync();
  };
  if (window.pywebview && window.pywebview.api) ready(); else addEventListener("pywebviewready", ready);
  document.addEventListener("click", async e => {
    const act = e.target.closest("[data-act]"), m = e.target.closest("[data-modal]"), step = e.target.closest("[data-tour]");
    if (step) return step.dataset.tour === "end" ? endTour() : tour(Number(step.dataset.tour));
    const look = e.target.closest("[data-look-mode], [data-look-palette]");
    if (look) return setLook(look.dataset.lookMode ? {mode: look.dataset.lookMode} : {palette: look.dataset.lookPalette});
    const txRow = e.target.closest("#tx tr[data-tx]");
    if (txRow && window.pywebview) {
      const t = TX[Number(txRow.dataset.tx)];
      return categorize(t.merchant, t.desc, t.cat === "Uncategorized" ? "" : t.cat);
    }
    if (e.target.closest("#addFiles") || (act && act.dataset.act === "add")) return addFiles();
    const bank = e.target.closest("#bankBtn");
    if (bank) return bankAction(bank);
    if (act) {
      const {id, file, rows} = act.dataset;
      if (act.dataset.act === "folder") return api().open_data_folder();
      if (act.dataset.act === "bank-connect") return connectBankForm();
      if (act.dataset.act === "bank-sync") return hold(act, "Syncing...", syncNow);
      if (act.dataset.act === "bank-review") return hold(act, "Checking...", openBankReview);
      if (act.dataset.act === "bank-disconnect") return confirmRemove("Disconnect SimpleFIN?", "Budgetier stops syncing and forgets the connection. Your transactions stay. To cut off access completely, disable it on the SimpleFIN site too.", () => removal(api().disconnect_bank()), "Disconnect");
      if (act.dataset.act === "banks") { S.tab = "Help"; return render(); }
      if (act.dataset.act === "home") { S.tab = "Overview"; return render(); }
      if (act.dataset.act === "tour") return tour();
      if (act.dataset.act === "categorize") return categorize(act.dataset.merchant, act.dataset.desc, "");
      if (act.dataset.act === "rule-new") return ruleForm({text: "", merchant: "", category: ""});
      if (act.dataset.act === "rule-edit") { const r = D.rules[Number(act.dataset.i)]; return ruleForm({...r}); }
      if (act.dataset.act === "rule-delete") {
        const r = D.rules[Number(act.dataset.i)];
        return confirmRemove("Remove this rule?", `Transactions matching "${r.text}" go back to their automatic category. You can add the rule again any time.`, () => removal(api().delete_rule(r.line)));
      }
      if (act.dataset.act === "budget-new") return budgetForm();
      if (act.dataset.act === "budget-edit") return budgetForm(B.targets.find(t => t.category === act.dataset.catName));
      if (act.dataset.act === "budget-delete") {
        const name = act.dataset.catName;
        return confirmRemove(`Remove the ${name} budget?`, "Your transactions aren't affected. You can add the budget again any time.", () => removal(api().delete_budget(name)));
      }
      if (act.dataset.act === "export") { const r = await api().export_workbook(); return toast(r.ok ? (r.saved ? `Saved ${r.saved}` : "") || "Not saved" : r.error); }
      if (act.dataset.act === "edit") return editAccount(id);
      if (act.dataset.act === "drop-import") return confirmRemove(`Remove ${file}?`, `This file added ${rows} transactions. Any that another imported file also covers will stay. To bring the rest back, import the file again.`, () => removal(api().remove_import(id)));
      if (act.dataset.act === "drop-account") {
        const a = D.accounts.find(x => x.id === id);
        return confirmRemove(`Remove ${a.name}?`, `This deletes its ${a.count.toLocaleString()} transactions and saved files from Budgetier. Your original files aren't touched, so you can import them again.`, () => removal(api().remove_account(id)));
      }
    }
    if (m) {
      const what = m.dataset.modal;
      if (what === "cancel") { await api().cancel(); return closeModal(); }
      if (what === "close") return closeModal();
      if (what === "reload") return reload();
      if (what === "import") return hold(m, "Adding...", () => runImport(m));
      if (what === "save") return hold(m, "Saving...", saveAccount);
      if (what === "rule-save") return hold(m, "Saving...", saveRule);
      if (what === "budget-save") return hold(m, "Saving...", saveBudget);
      if (what === "bank-connect") return hold(m, "Connecting...", connectBank);
      if (what === "bank-link") return hold(m, "Saving...", linkBank);
      if (what === "confirm") return hold(m, "Working...", modal.onConfirm);
    }
  });
}

/* ---------- controls ---------- */
(function init() {
  const tabs = document.getElementById("tabs");
  TABS.forEach(t => { const b = document.createElement("button"); b.innerHTML = `${icon(ICONS[t])}<span>${t}</span>`; b.dataset.tab = t; if (t === "Rules" || t === "Budgets") b.className = "app-only"; b.setAttribute("role", "tab"); b.onclick = () => { S.tab = t; render(true); scrollTo(0, 0); }; tabs.append(b); });

  document.getElementById("theme").innerHTML = `${icon(SUN)}Appearance`;
  document.getElementById("theme").onclick = appearance;

  const sel = document.getElementById("range"), years = [...new Set(MONTHS.map(m => m.slice(0, 4)))].reverse();
  const group = (label, opts) => `<optgroup label="${label}">${opts.map(([v, n]) => `<option value="${v}">${n}</option>`).join("")}</optgroup>`;
  sel.innerHTML = group("Recent", [["12", "Last 12 months"], ["6", "Last 6 months"], ["3", "Last 3 months"], ["all", "All time"]])
    + group("Year", years.map(y => [y, y])) + group("Month", MONTHS.slice().reverse().map(m => [m, mName(m)]));
  sel.onchange = () => { S.range = sel.value; render(); };

  const list = document.getElementById("acctList"), label = document.getElementById("acctLabel");
  list.innerHTML = D.accounts.map(a => `<label><input type="checkbox" value="${a.index}" checked> ${esc(a.name)}</label>`).join("");
  list.addEventListener("change", e => {
    const i = Number(e.target.value);
    e.target.checked ? S.accts.add(i) : S.accts.delete(i);
    label.textContent = S.accts.size === D.accounts.length ? "All accounts" : `${S.accts.size} of ${D.accounts.length} accounts`;
    render();
  });
  document.addEventListener("click", e => { const box = document.getElementById("acctBox"); if (box.open && !box.contains(e.target)) box.open = false; });

  document.getElementById("foot").textContent = (TX.length ? `Data through ${dName(D.end)}. ` : "") + `${D.sync && D.sync.connected ? "Stored on this computer." : "Stays on this computer."}${D.version ? ` Version ${D.version}.` : ""}`;
  try { const tab = sessionStorage.getItem("budgetier-tab"); if (TABS.includes(tab)) S.tab = tab; } catch {}
  const restored = restoreView();
  if ([...sel.options].some(o => o.value === S.range)) sel.value = S.range; else S.range = sel.value;
  list.querySelectorAll("input").forEach(box => { box.checked = S.accts.has(Number(box.value)); });
  if (S.accts.size < D.accounts.length) label.textContent = `${S.accts.size} of ${D.accounts.length} accounts`;
  // Charts are drawn to the measured width, which can be unknown at first paint.
  let t, width = 0;
  render();
  initApp();
  if (restored) setTimeout(() => { scrollTo(0, restored.y); if (restored.note) toast(restored.note); }, 50);  // after the first measured redraw
  new ResizeObserver(([e]) => {
    if (Math.abs(e.contentRect.width - width) < 1) return;
    const first = !width; width = e.contentRect.width;
    if (S.tab === "Transactions") return;  // no charts, and redrawing would drop search focus
    clearTimeout(t); t = setTimeout(render, first ? 0 : 150);
  }).observe(document.getElementById("view"));
})();
</script>
