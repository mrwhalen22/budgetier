<!doctype html>
<html lang="en" data-mode="light" data-palette="pine">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budgetier</title>
<script>
// Before anything draws, so the page never flashes the wrong theme.
const LOOK_KEY = "budgetier-look", PALETTES = [["pine", "Pine"], ["ocean", "Ocean"], ["plum", "Plum"]];
const Look = {mode: "system", palette: "pine"};
try {
  const saved = JSON.parse(localStorage.getItem(LOOK_KEY)) || {}, older = localStorage.getItem("budgetier-theme");
  Object.assign(Look, older ? {mode: older} : {}, saved);
} catch {}
function applyLook() {
  const system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light", root = document.documentElement;
  root.dataset.mode = Look.mode === "system" ? system : Look.mode;
  root.dataset.palette = PALETTES.some(([p]) => p === Look.palette) ? Look.palette : "pine";
}
applyLook();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyLook);
</script>
<style>
/* =========================================================================
   Budgetier design system. Three layers, read top to bottom:

   1. Tokens: the only place a color, size or corner is written down. Everything
      below uses var(--name). tests/test_design.py keeps it that way, and checks
      every theme for readable contrast.
   2. Components: the one button, field, card, panel, banner and table.
   3. Views: layout for particular screens. No new looks belong here.

   A theme is a palette (Pine, Ocean, Plum) in a mode (light, dark). Palettes set
   the brand and neutrals. Modes set what money means: green is always good and
   red always bad, so numbers read the same in every theme.
   ========================================================================= */

/* ---- 1. tokens: scale, the same in every theme ---- */
:root {
  --text-xs: 12px; --text-sm: 13px; --text-md: 14px; --text-lg: 16px;
  --text-xl: 20px; --text-2xl: 26px; --text-3xl: 34px; --text-4xl: 52px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-full: 999px;
  --control: 36px; --control-sm: 28px;
  --display: "Segoe UI Variable Display", "Segoe UI Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --body: "Segoe UI Variable Text", "Segoe UI Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --code: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
}

/* ---- 1. tokens: modes ---- */
[data-mode="light"] {
  color-scheme: light;
  --good: #0b6b34; --bad: #b3232a; --on-bad: #ffffff;
  --good-bg: #e2f2e8; --bad-bg: #fbe8e6; --warn-bg: #fbf1da; --warn-ink: #5e4306; --info-bg: #e7eff7; --info-ink: #1b456e;
  --income: #1f9d55; --spending: #e34948; --other: #a9a79f;
  --c0: #2a78d6; --c1: #eb6834; --c2: #1baf7a; --c3: #eda100; --c4: #e87ba4; --c5: #008300; --c6: #6250d6; --c7: #e34948;
  --line-soft: rgba(23, 32, 28, .08); --hover: rgba(23, 32, 28, .05); --scrim: rgba(8, 14, 12, .5);
  --shadow: 0 1px 2px rgba(23, 32, 28, .05), 0 10px 24px -18px rgba(23, 32, 28, .2);
  --shadow-lg: 0 24px 60px -20px rgba(8, 14, 12, .45);
}
[data-mode="dark"] {
  color-scheme: dark;
  --good: #4ccb84; --bad: #f28b86; --on-bad: #2a0d0c;
  --good-bg: #12301f; --bad-bg: #3a1a19; --warn-bg: #30270f; --warn-ink: #f2cf7c; --info-bg: #15263a; --info-ink: #a5c8ee;
  --income: #2fb36a; --spending: #e66767; --other: #6f6d68;
  --c0: #3987e5; --c1: #d95926; --c2: #199e70; --c3: #c98500; --c4: #d55181; --c5: #008300; --c6: #9085e9; --c7: #e66767;
  --line-soft: rgba(255, 255, 255, .09); --hover: rgba(255, 255, 255, .06); --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 24px -18px rgba(0, 0, 0, .6);
  --shadow-lg: 0 24px 60px -20px rgba(0, 0, 0, .75);
}

/* ---- 1. tokens: palettes ---- */
[data-mode="light"][data-palette="pine"] {
  --page: #f4f2ec; --surface: #fffefb; --raised: #f9f7f1; --nav: #ebe8df; --line: #e2ded2;
  --ink: #17201c; --ink-2: #46514b; --muted: #5d675f;
  --accent: #7d6128; --on-accent: #fffdf7; --accent-soft: #f1e8d3;
}
[data-mode="dark"][data-palette="pine"] {
  --page: #0b100e; --surface: #141b18; --raised: #1a221e; --nav: #0e1512; --line: #27312c;
  --ink: #eef1ec; --ink-2: #b9c2bc; --muted: #929c95;
  --accent: #d6b06a; --on-accent: #17201c; --accent-soft: #2e2817;
}
[data-mode="light"][data-palette="ocean"] {
  --page: #f1f4f7; --surface: #ffffff; --raised: #f6f8fb; --nav: #e5ebf2; --line: #d9e1e9;
  --ink: #14202b; --ink-2: #43525f; --muted: #566675;
  --accent: #1f63b5; --on-accent: #ffffff; --accent-soft: #e0ecf8;
}
[data-mode="dark"][data-palette="ocean"] {
  --page: #0a1016; --surface: #121a22; --raised: #18222c; --nav: #0d141b; --line: #24313d;
  --ink: #ebf0f5; --ink-2: #b4c0cc; --muted: #8f9dab;
  --accent: #6aa9ee; --on-accent: #0b1620; --accent-soft: #16283b;
}
[data-mode="light"][data-palette="plum"] {
  --page: #f6f2f6; --surface: #fffdff; --raised: #f9f5f9; --nav: #eee6ee; --line: #e4dae4;
  --ink: #221a24; --ink-2: #544857; --muted: #685b6b;
  --accent: #7a3f94; --on-accent: #ffffff; --accent-soft: #f0e3f5;
}
[data-mode="dark"][data-palette="plum"] {
  --page: #110c13; --surface: #1a141d; --raised: #211a25; --nav: #140f17; --line: #332a38;
  --ink: #f3eef5; --ink-2: #c4b9c8; --muted: #a094a6;
  --accent: #c89be0; --on-accent: #1d1222; --accent-soft: #2c2033;
}

/* ---- base ---- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: var(--text-md)/1.5 var(--body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; letter-spacing: -.01em; }
h1 { font-size: var(--text-2xl); line-height: 1.15; letter-spacing: -.02em; }
h2 { font-size: var(--text-lg); line-height: 1.3; }
h3 { font-size: var(--text-md); line-height: 1.3; }
p { margin: 0; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dim { color: var(--muted); font-size: var(--text-sm); font-weight: 400; }
.strong { font-weight: 500; }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.clip { max-width: clamp(180px, 22vw, 560px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { color: var(--muted); padding: var(--space-6) 0; text-align: center; }
.code { font-family: var(--code); font-size: var(--text-xs); }
body:not(.in-app) .app-only { display: none; }

/* ---- 2. components: button ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: var(--control); padding: 0 var(--space-3);
  font: 500 var(--text-sm)/1.2 var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }
.btn.danger:hover { background: color-mix(in srgb, var(--bad) 88%, var(--ink)); }
.btn.danger-text { color: var(--bad); }
.btn.small { min-height: var(--control-sm); padding: 0 var(--space-2); font-size: var(--text-xs); border-radius: var(--radius-sm); }
.btn:disabled { opacity: .55; cursor: default; }
.tools { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-4); }
.tools.inset { margin: var(--space-3) 0 0; }
.row-actions { display: flex; gap: var(--space-1); justify-content: flex-end; }

/* ---- 2. components: field ---- */
select, input[type=search], input[type=text], input[type=date], input[type=password], input:not([type]), details.acct summary {
  min-height: var(--control); padding: 0 var(--space-3); font: 400 var(--text-sm)/1.3 var(--body); color: var(--ink); background-color: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius-md); }
input::placeholder { color: var(--muted); }
select { appearance: none; padding-right: var(--space-8); cursor: pointer; background-repeat: no-repeat; background-size: 5px 5px;
  background-position: right 17px center, right 12px center;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); }
option, optgroup { background: var(--surface); color: var(--ink); }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: var(--space-1); font-size: var(--text-xs); font-weight: 500; color: var(--ink-2); min-width: 0; }
.field input, .field select { width: 100%; }
.field.full { grid-column: 1 / -1; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-2) var(--space-3); margin-top: var(--space-2); }
.pick { display: flex; gap: var(--space-2); }
.controls { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3); align-items: center; }
.controls input[type=search] { flex: 1; min-width: 200px; }
label.f { font-size: var(--text-sm); color: var(--ink-2); display: inline-flex; gap: var(--space-2); align-items: center; cursor: pointer; }
.ask { margin-top: var(--space-3); font-size: var(--text-sm); }
.ask b { font-weight: 600; }
.ask label { margin-right: var(--space-3); display: inline-flex; gap: var(--space-1); align-items: center; }
details.acct { position: relative; }
details.acct summary { display: flex; align-items: center; cursor: pointer; list-style: none; user-select: none; }
details.acct summary::-webkit-details-marker { display: none; }
details.acct div { position: absolute; z-index: 10; right: 0; top: calc(100% + var(--space-1)); min-width: 260px; padding: var(--space-2);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
details.acct label { display: flex; gap: var(--space-2); align-items: center; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); font-size: var(--text-sm); cursor: pointer; }
details.acct label:hover { background: var(--hover); }

/* ---- 2. components: card, tile, panel ---- */
.card, .tile { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow), 0 0 0 1px var(--line-soft); min-width: 0; }
.card { padding: var(--space-5); margin-bottom: var(--space-4); }
.card .sub, .sub { font-size: var(--text-sm); color: var(--muted); margin: var(--space-1) 0 var(--space-3); }
.card h2 + .chart, .card h2 + .scroll { margin-top: var(--space-3); }
.card > p + p { margin-top: var(--space-2); }
.tile { padding: var(--space-4) var(--space-5); }
.tile .k { font-size: var(--text-sm); font-weight: 500; color: var(--ink-2); }
.tile .v { font: 600 var(--text-2xl)/1.2 var(--display); letter-spacing: -.02em; margin-top: var(--space-1); font-variant-numeric: tabular-nums; }
.tile .s { font-size: var(--text-xs); color: var(--muted); margin-top: var(--space-1); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-4); }
.tiles:empty { display: none; }
.tile:only-child { max-width: 340px; }
.panel { background: var(--raised); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-3); font-size: var(--text-sm); color: var(--ink-2); overflow-wrap: anywhere; }
.panel h3 { color: var(--ink); }
.panel b { color: var(--ink); font-weight: 600; }
.panel .sub { margin: 0; }
.panel .warn { color: var(--bad); display: block; margin-top: var(--space-1); }
.panel ul { margin: var(--space-1) 0 0; padding-left: var(--space-4); color: var(--muted); }
.panel:empty { display: none; }

/* ---- 2. components: banner ---- */
.banner { display: flex; gap: var(--space-2); padding: var(--space-2) var(--space-3); margin-bottom: var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); overflow-wrap: anywhere; }
.banner svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.banner b { display: block; font-weight: 600; }
.banner:last-child { margin-bottom: 0; }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
.banner.info { background: var(--info-bg); color: var(--info-ink); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner.good { background: var(--good-bg); color: var(--good); }
details.banner { display: block; margin-bottom: var(--space-4); padding: 0; }
details.banner summary { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); list-style: none; cursor: pointer; font-weight: 600; }
details.banner summary::-webkit-details-marker { display: none; }
details.banner summary svg { margin: 0; }
details.banner summary span { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
details.banner[open] summary span { display: none; }
details.banner .open { margin-left: auto; font-size: var(--text-xs); font-weight: 500; font-style: normal; flex: none; }
details.banner[open] .open::after { content: "Hide"; }
details.banner:not([open]) .open::after { content: "Show"; }
.banner-list { padding: 0 var(--space-3) var(--space-3) var(--space-8); }
.banner-list p { margin-bottom: var(--space-2); }
.banner-list p:last-child { margin: 0; }
.banner-list b { display: block; font-weight: 600; }

/* ---- 2. components: badge and small marks ---- */
.badge { display: inline-block; font-size: var(--text-xs); font-weight: 500; line-height: 1.5; padding: 0 var(--space-2); border-radius: var(--radius-full); white-space: nowrap; color: var(--ink-2); background: var(--hover); }
.badge.good { color: var(--good); background: var(--good-bg); }
.who { display: flex; align-items: center; gap: var(--space-2); font-weight: 500; }
.who > span:last-child { overflow: hidden; text-overflow: ellipsis; }
.mono { flex: none; width: 28px; height: 28px; border-radius: var(--radius-full); display: grid; place-items: center; font: 600 var(--text-xs)/1 var(--display); color: var(--m);
  background: color-mix(in srgb, var(--m) 14%, transparent); }
.chip { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--ink-2); font-size: var(--text-sm); }
.chip i, .legend i, #tip i, .hbar .name i { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: var(--radius-full); }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); font-size: var(--text-xs); color: var(--ink-2); margin: var(--space-2) 0; }
.legend i { margin-right: var(--space-1); }
.up { color: var(--bad); font-size: var(--text-xs); white-space: nowrap; }
.down { color: var(--good); font-size: var(--text-xs); white-space: nowrap; }

/* ---- 2. components: table ---- */
.scroll { overflow-x: auto; margin: 0 calc(-1 * var(--space-1)); }
.scroll td { white-space: nowrap; }
table { border-collapse: collapse; width: 100%; font-size: var(--text-sm); }
th { text-align: left; font-size: var(--text-xs); font-weight: 500; color: var(--muted); padding: var(--space-2) var(--space-3); white-space: nowrap; border-bottom: 1px solid var(--line); }
th.num { text-align: right; }
th[data-sort] { cursor: pointer; user-select: none; }
th[data-sort]:hover { color: var(--ink); }
td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--line); }
td.num { font-weight: 500; }
.link { cursor: pointer; }
td.missed { color: var(--bad); font-weight: 600; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--hover); }
.heat td { padding: var(--space-2); }
.heat td.cell { cursor: pointer; border-left: 2px solid var(--surface); border-bottom: 2px solid var(--surface); }
.heat tbody tr:hover td { background: revert-layer; }
.more { display: block; margin: var(--space-3) auto 0; }

/* ---- 2. components: dialog, toast, tooltip, coach ---- */
dialog { border: 0; padding: 0; border-radius: var(--radius-lg); background: var(--surface); color: var(--ink); width: min(620px, calc(100vw - var(--space-8))); max-height: calc(100vh - var(--space-10)); box-shadow: var(--shadow-lg); }
dialog::backdrop { background: var(--scrim); backdrop-filter: blur(3px); }
.modal { display: flex; flex-direction: column; max-height: calc(100vh - var(--space-10)); }
.modal-head { padding: var(--space-5) var(--space-6) var(--space-3); }
.modal-head h2 { font-size: var(--text-xl); line-height: 1.25; }
.modal-head p { margin-top: var(--space-1); font-size: var(--text-sm); color: var(--muted); }
.modal-body { padding: var(--space-1) var(--space-6) var(--space-2); overflow-y: auto; }
.modal-body > p { margin-bottom: var(--space-2); }
.modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-2); padding: var(--space-3) var(--space-6) var(--space-5); }
.modal-foot .msg { margin-right: auto; font-size: var(--text-sm); color: var(--bad); }
.done-row { display: flex; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--line); font-size: var(--text-sm); }
.done-row:last-child { border-bottom: 0; }
#toast { position: fixed; z-index: 30; left: 50%; bottom: var(--space-6); transform: translateX(-50%); display: none; max-width: min(520px, calc(100vw - var(--space-8))); padding: var(--space-2) var(--space-4);
  background: var(--ink); color: var(--surface); border-radius: var(--radius-md); font-size: var(--text-sm); box-shadow: var(--shadow-lg); }
#tip { position: fixed; pointer-events: none; z-index: 20; display: none; max-width: 300px; padding: var(--space-2) var(--space-3); font-size: var(--text-sm);
  background: var(--surface); color: var(--ink); border-radius: var(--radius-md); box-shadow: var(--shadow-lg), 0 0 0 1px var(--line-soft); }
#tip b { display: block; margin-bottom: var(--space-1); font-weight: 600; }
#tip div { display: flex; justify-content: space-between; gap: var(--space-4); }
#tip i { margin-right: var(--space-2); }
#tip span:last-child { font-variant-numeric: tabular-nums; }
#spot { position: fixed; z-index: 40; border-radius: var(--radius-md); box-shadow: 0 0 0 9999px var(--scrim), 0 0 0 2px var(--accent); pointer-events: none; transition: all .22s ease; }
#coach { position: fixed; z-index: 41; width: min(340px, calc(100vw - var(--space-8))); padding: var(--space-4) var(--space-5); background: var(--surface); color: var(--ink); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
#coach h3 { font-size: var(--text-lg); margin-bottom: var(--space-1); }
#coach p { margin-bottom: var(--space-3); font-size: var(--text-sm); color: var(--ink-2); }
#coach .row { display: flex; align-items: center; gap: var(--space-2); }
#coach .count { margin-right: auto; font-size: var(--text-xs); color: var(--muted); }

/* ---- 2. components: appearance picker ---- */
.choice-label { font-size: var(--text-xs); font-weight: 500; color: var(--ink-2); margin: var(--space-2) 0 var(--space-2); }
.segments { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-1); padding: var(--space-1); background: var(--raised); border-radius: var(--radius-md); margin-bottom: var(--space-3); }
.segments button { all: unset; box-sizing: border-box; text-align: center; padding: var(--space-2); font-size: var(--text-sm); font-weight: 500; color: var(--ink-2); border-radius: var(--radius-sm); cursor: pointer; }
.segments button:hover { background: var(--hover); }
.segments button:focus-visible { outline: 2px solid var(--accent); }
.segments button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow), 0 0 0 1px var(--line-soft); }
.swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin-bottom: var(--space-3); }
.swatch { all: unset; box-sizing: border-box; display: block; background: var(--page); color: var(--ink); border-radius: var(--radius-md); padding: var(--space-3); cursor: pointer; box-shadow: 0 0 0 1px var(--line); font-size: var(--text-sm); font-weight: 500; }
.swatch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.swatch[aria-pressed=true] { box-shadow: 0 0 0 2px var(--accent); }
.swatch i { display: block; height: 28px; margin-bottom: var(--space-2); border-radius: var(--radius-sm); background: linear-gradient(90deg, var(--nav) 0 30%, var(--surface) 30% 72%, var(--accent) 72%); box-shadow: 0 0 0 1px var(--line-soft); }

/* ---- 3. views: frame ---- */

function bars(el, {months, series, stacked = false, height = 260}) {
  const vals = months.map((_, i) => series.map(s => s.values[i]));
  const hi = stacked ? Math.max(...vals.map(v => sum(v, x => Math.max(x, 0)))) : Math.max(...vals.flat());
  const lo = stacked ? Math.min(0, ...vals.map(v => sum(v, x => Math.min(x, 0)))) : Math.min(0, ...vals.flat());
  const f = frame(el, height, months, lo, hi);
  const inner = Math.min(f.band * .72, 96), tips = {};
  let marks = "", hits = "";
  months.forEach((m, i) => {
    if (stacked) {
      let up = 0, dn = 0;
      const w = Math.min(inner, Math.max(26, f.band * .42)), bx = f.x(i) + (f.band - w) / 2;
      series.forEach(s => {
        const v = s.values[i]; if (!v) return;
        const a = v > 0 ? up : dn, b = a + v;
        if (v > 0) up = b; else dn = b;
        const y0 = f.y(Math.max(a, b)), h = Math.max(Math.abs(f.y(a) - f.y(b)) - 2, 1);
        marks += `<rect x="${bx}" y="${y0}" width="${w}" height="${h}" rx="2.5" fill="${s.color}"/>`;
      });
    } else {
      const w = Math.min((inner - 3 * (series.length - 1)) / series.length, Math.max(15, f.band * .28));
      const total = w * series.length + 3 * (series.length - 1), start = f.x(i) + (f.band - total) / 2;
      series.forEach((s, k) => {
        const v = s.values[i], y0 = f.y(Math.max(v, 0)), h = Math.abs(f.y(v) - f.y(0));
        if (h > 0) marks += `<rect x="${start + k * (w + 3)}" y="${y0}" width="${w}" height="${Math.max(h, 1)}" rx="${Math.min(4, w / 2)}" fill="${s.colorFor ? s.colorFor(v) : s.color}"/>`;
      });
    }
    tips[i] = {title: mName(m) + (m === D.partialMonth ? " (so far)" : ""), rows: series.filter(s => !stacked || s.values[i]).slice().reverse().map(s => ({k: s.name, v: money(s.values[i]), c: s.colorFor ? s.colorFor(s.values[i]) : s.color}))};
    if (stacked) tips[i].rows.push({k: "Total", v: money(sum(series, s => s.values[i]))});
    hits += `<rect class="hit" data-tip="${i}" x="${f.x(i)}" y="${f.T}" width="${f.band}" height="${f.H - f.T - f.B}"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${f.W} ${f.H}" height="${f.H}" role="img">${f.g}${marks}${hits}</svg>`;
  bindTips(el, tips);
}
function lines(el, {months, series, height = 260}) {
  const all = series.flatMap(s => s.values.filter(v => v !== null));
  if (!all.length) { el.innerHTML = '<p class="empty">No data in this period.</p>'; return; }
  const f = frame(el, height, months, Math.min(0, ...all), Math.max(...all));
  const tips = {}; let marks = "", hits = "";
  series.forEach(s => {
    let d = "", pen = false;
    s.values.forEach((v, i) => { if (v === null) { pen = false; return; } d += `${pen ? "L" : "M"}${f.x(i) + f.band / 2} ${f.y(v)}`; pen = true; });
    if (series.length === 1 && months.length > 1) {  // a soft wash under a lone line
      const base = f.y(Math.max(0, Math.min(...all))), ends = s.values.map((v, i) => v === null ? null : f.x(i) + f.band / 2).filter(x => x !== null);
      const id = `wash${el.id}`;
      marks += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".2"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${ends[ends.length - 1]} ${base}L${ends[0]} ${base}Z" fill="url(#${id})"/>`;
    }
    marks += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v, i) => { if (v !== null && (months.length <= 2 || i === s.values.length - 1)) marks += `<circle cx="${f.x(i) + f.band / 2}" cy="${f.y(v)}" r="4" fill="${s.color}" stroke="${CSS("surface")}" stroke-width="2"/>`; });
  });
  months.forEach((m, i) => {
    tips[i] = {title: mName(m), rows: series.filter(s => s.values[i] !== null).map(s => ({k: s.name, v: money(s.values[i]), c: s.color}))};
    hits += `<rect class="hit" data-tip="${i}" x="${f.x(i)}" y="${f.T}" width="${f.band}" height="${f.H - f.T - f.B}"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${f.W} ${f.H}" height="${f.H}" role="img">${f.g}${marks}${hits}</svg>`;
  bindTips(el, tips);
}
function hbars(items, fmt, barColor) {
  const max = Math.max(...items.map(i => i.value), 1), total = sum(items, i => i.value);
  return items.map(i => `<div class="hbar" role="button" tabindex="0" data-cat="${esc(i.cat || "")}" data-q="${esc(i.q || "")}"><div class="name">${i.color ? `<i style="background:${i.color}"></i>` : ""}<span title="${esc(i.name)}">${esc(i.name)}</span></div>
    <div class="num"><span class="pct">${Math.round(i.value / total * 100)}%</span><span class="neg">${fmt(i.value)}</span></div>
    <div class="track"><div class="fill" style="width:${Math.max(i.value / max * 100, .5)}%;background:${i.color || barColor}"></div></div></div>`).join("");
}
const mono = (name, c) => `<span class="mono" style="--m:${c}" aria-hidden="true">${esc(name.split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase())}</span>`;
const who = (name, cat) => `<div class="who">${mono(name, color(cat))}<span>${esc(name)}</span></div>`;
const chip = cat => `<span class="chip"><i style="background:${color(cat)}"></i>${esc(cat)}</span>`;
function drillDown(root) {
  root.querySelectorAll("[data-cat],[data-q]").forEach(n => n.addEventListener("click", () => {
    if (!n.dataset.cat && !n.dataset.q) return;
    Object.assign(S, {txcat: n.dataset.cat || "", txq: n.dataset.q || "", txkind: "", txshow: 200, tab: "Transactions"});
    render(true);
  }));
  root.querySelectorAll(".hbar").forEach(n => n.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); n.click(); } }));
}

/* ---------- views ---------- */
const V = document.getElementById("view");
function tile(k, v, s, t = "") { return `<div class="tile"><div class="k">${esc(k)}</div><div class="v ${t}">${esc(v)}</div>${s ? `<div class="s">${esc(s)}</div>` : ""}</div>`; }
function checksHtml(list) { return list.map(c => `<div class="banner ${c.level === "warning" ? "warn" : "info"}">${icon(c.level === "warning" ? ALERT : INFO)}<div><b>${esc(c.title)}</b>${esc(c.detail)}</div></div>`).join(""); }
function noticeBar(list) {
  if (!list.length) return "";
  const n = list.length;
  return `<details class="banner warn"><summary>${icon(ALERT)}${n} thing${n === 1 ? "" : "s"} to check<span>${esc(list[0].title)}</span><em class="open"></em></summary>
    <div class="banner-list">${list.map(c => `<p><b>${esc(c.title)}</b>${esc(c.detail)}</p>`).join("")}</div></details>`;
}
function catTotals(rows) {
  const c = {}; rows.forEach(r => Object.entries(r.cats).forEach(([k, v]) => c[k] = (c[k] || 0) + v));
  return Object.entries(c).sort((a, b) => b[1] - a[1]);
}
// A negative card balance is money owed. Cards with no balance entered are left out.
function owedTile() {
  const cards = D.accounts.filter(a => a.type === "credit"), known = cards.filter(a => a.balance !== null);
  if (!known.length) return "";
  const owed = sum(known, a => a.balance), missing = cards.length - known.length;
  return tile("Owed on cards", money(owed), missing ? `${missing} card${missing === 1 ? "" : "s"} not set` : "calculated from what you entered", tone(owed));
}
function activeRecurring() { return D.recurring.filter(r => r.active && r.kind === "expense"); }
function periodNote(rows) {
  if (rows.length === 1) return "";
  const n = completed(rows).length, early = rows.filter(r => !hasBills(r.month)).length;
  return `average of ${n} complete month${n === 1 ? "" : "s"}` + (early ? `; ${early} earlier skipped, no checking history` : "");
}

function overview() {
  const months = rangeMonths(), rows = monthly(selected(), months), done = completed(rows), one = rows.length === 1;
  const inc = sum(done, r => r.income) / done.length, sp = sum(done, r => r.spending) / done.length;
  const rate = inc > 0 ? (inc - sp) / inc : null, rec = sum(activeRecurring(), r => r.per_month);
  const note = periodNote(rows), avg = one ? "" : "Avg. monthly ";
  const months_ = new Set(done.map(r => r.month));
  const est = -sum(selected().filter(t => t.kind === "estimate" && months_.has(t.month)), t => t.amt) / done.length;
  const warns = D.checks.filter(c => c.level === "warning");
  const peak = Math.max(...rows.map(r => r.spending), 1), spent = inc > 0 ? Math.min(sp / inc, 1) : 1, kept = inc - sp;
  const spark = rows.slice(-18).map(r => `<i class="${months_.has(r.month) ? "" : "off"}" style="height:${Math.max(r.spending / peak * 100, 2).toFixed(1)}%"></i>`).join("");
  V.innerHTML = `${noticeBar(warns)}
    <div class="lead"><section class="hero">
      <div><div class="k">${avg ? avg + "spending" : "Spending"}</div><div class="big">${money(sp)}</div>
        <div class="s">${esc((est > 0 ? `Includes ${money(est)} estimated from card payments. ` : "") + (note ? note[0].toUpperCase() + note.slice(1) + "." : ""))}</div></div>
      <div class="spark" aria-hidden="true">${one ? "" : spark}</div>
      <div class="flow">
        <div class="flow-bar"><span class="spent" style="flex:${spent.toFixed(3)}"></span>${kept > 0 ? `<span class="kept" style="flex:${(1 - spent).toFixed(3)}"></span>` : ""}</div>
        <div class="flow-key"><span>Of every dollar earned</span><span><b class="a">${Math.round(spent * 100)}% spent</b>${kept > 0 ? ` &nbsp;·&nbsp; <b class="b">${100 - Math.round(spent * 100)}% kept</b>` : ""}</span></div>
      </div>
    </section>
    <div class="tiles">
      ${tile(avg ? avg + "income" : "Income", money(inc), one ? "" : "same months as spending", "pos")}
      ${tile("Savings rate", rate === null ? "n/a" : Math.round(rate * 100) + "%", money(inc - sp) + (one ? " kept" : " kept per month"), tone(inc - sp))}
      ${tile("Recurring bills", money(rec) + "/mo", activeRecurring().length + " active", "neg")}
      ${owedTile()}
    </div></div>
    <div class="split">
      <div class="card"><h2>Income and spending</h2>${legend([{name: "Income", color: CSS("income")}, {name: "Spending", color: CSS("spending")}])}<div class="chart" id="c1"></div></div>
      <div class="card"><h2>Where it went</h2><p class="sub">Select a category to see its transactions.</p><div id="cats"></div></div>
    </div>`;
  bars(document.getElementById("c1"), {months, series: [
    {name: "Income", color: CSS("income"), values: rows.map(r => r.income)},
    {name: "Spending", color: CSS("spending"), values: rows.map(r => r.spending)}]});
  const cats = catTotals(rows).filter(c => c[1] > 0);
  document.getElementById("cats").innerHTML = cats.length ? hbars(cats.slice(0, 8).map(([name, value]) => ({name, value, cat: name, color: color(name)})), money, CSS("spending")) : '<p class="empty">No spending in this period.</p>';
  drillDown(V);
}

function spending() {
  const months = rangeMonths(), rows = monthly(selected(), months);
  const cats = catTotals(rows), keep = cats.map(c => c[0]).filter(c => CAT_COLOR[c]);
  const series = keep.map(c => ({name: c, color: color(c), values: rows.map(r => Math.max(r.cats[c] || 0, 0))}));
  const rest = rows.map(r => sum(Object.entries(r.cats).filter(([k]) => !CAT_COLOR[k]), e => Math.max(e[1], 0)));
  if (rest.some(v => v)) series.push({name: "Other", color: CSS("other"), values: rest});
  const shown = months.slice(-12), rowsShown = rows.slice(-12);
  const peak = Math.max(...rowsShown.flatMap(r => Object.values(r.cats)), 1);
  const body = cats.map(([c, total]) => `<tr><td class="link" data-cat="${esc(c)}">${chip(c)}</td>${rowsShown.map(r => {
      const v = r.cats[c] || 0, a = Math.sqrt(Math.max(v, 0) / peak) * 30;
      return `<td class="num cell ${tone(-v)}" data-cat="${esc(c)}" style="background:color-mix(in srgb, var(--spending) ${a.toFixed(0)}%, transparent)">${v ? short(v) : ""}</td>`; }).join("")}
    <td class="num ${tone(-total)}"><b>${money(total)}</b></td></tr>`).join("");
  V.innerHTML = `<div class="card"><h2>Spending by category</h2>${legend(series)}<div class="chart" id="c1"></div></div>
    <div class="card"><h2>Category by month</h2><p class="sub">Darker means more spent${months.length > 12 ? "; showing the latest 12 months, totals cover the full period" : ""}. Refunds are netted out.</p>
    <div class="scroll"><table class="heat"><thead><tr><th>Category</th>${shown.map(m => `<th class="num">${mName(m, false)}</th>`).join("")}<th class="num">Total</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
  bars(document.getElementById("c1"), {months, series: series.slice().reverse(), stacked: true, height: 300});
  drillDown(V);
}

function recurring() {
  const list = D.recurring.filter(r => S.recAll || r.active);
  const bills = list.filter(r => r.kind === "expense" && r.active), income = list.filter(r => r.kind === "income" && r.active);
  const subs = bills.filter(r => r.category === "Subscriptions");
  const row = r => {
    const change = r.price_change ? `<span class="${(r.price_change > 0) === (r.kind === "expense") ? "up" : "down"}">${r.price_change > 0 ? "▲ up" : "▼ down"} ${cents(Math.abs(r.price_change))}</span>` : "";
    return `<tr class="link" data-q="${esc(r.merchant)}"><td><div class="who">${mono(r.merchant, color(r.category))}<span>${esc(r.merchant)}</span>${r.active ? "" : '<span class="badge">stopped</span>'}</div></td><td>${chip(r.category)}</td><td class="dim">${r.cadence}</td>
      <td class="num ${r.kind === "income" ? "pos" : "neg"}">${r.variable ? "~" : ""}${cents(r.amount)}</td><td class="num ${r.kind === "income" ? "pos" : "neg"}">${cents(r.per_month)}</td><td>${change}</td><td class="dim">${dName(r.last)}</td><td class="dim">${r.active ? dName(r.next) : ""}</td><td class="dim clip">${esc(r.account)}</td></tr>`; };
  const table = rows => rows.length ? `<div class="scroll"><table><thead><tr><th>Name</th><th>Category</th><th>Every</th><th class="num">Amount</th><th class="num">Monthly</th><th>Change</th><th>Last</th><th>Next</th><th>Account</th></tr></thead><tbody>${rows.map(row).join("")}</tbody></table></div>` : '<p class="empty">None found.</p>';
  V.innerHTML = `<div class="tiles">${tile("Recurring bills", money(sum(bills, r => r.per_month)) + "/mo", money(sum(bills, r => r.per_month) * 12) + " a year", "neg")}
      ${tile("Subscriptions", money(sum(subs, r => r.per_month)) + "/mo", subs.length + " active", "neg")}
      ${tile("Regular income", money(sum(income, r => r.per_month)) + "/mo", income.length + " source" + (income.length === 1 ? "" : "s"), "pos")}</div>
    <div class="controls"><label class="f"><input type="checkbox" id="recAll" ${S.recAll ? "checked" : ""}> Include stopped payments</label></div>
    <div class="card"><h2>Bills and subscriptions</h2><p class="sub">~ means the amount varies. Found from the full history, so the period filter doesn't apply here.</p>${table(list.filter(r => r.kind === "expense"))}</div>
    <div class="card"><h2>Regular income</h2>${table(list.filter(r => r.kind === "income"))}</div>`;
  document.getElementById("recAll").onchange = e => { S.recAll = e.target.checked; render(); };
  drillDown(V);
}

function largest() {
  const tx = selected().filter(t => t.kind === "expense"), top = tx.slice().sort((a, b) => a.amt - b.amt).slice(0, 25);
  const by = {};
  tx.forEach(t => { const m = by[t.merchant] = by[t.merchant] || {name: t.merchant, value: 0, n: 0, q: t.merchant}; m.value -= t.amt; m.n++; });
  const merchants = Object.values(by).sort((a, b) => b.value - a.value).slice(0, 15);
  V.innerHTML = `<div class="two"><div class="card"><h2>Top merchants</h2><p class="sub">By total spent.</p>${merchants.length ? hbars(merchants, money, CSS("spending")) : '<p class="empty">Nothing in this period.</p>'}</div>
    <div class="card"><h2>Largest single expenses</h2><p class="sub">The 25 biggest in this period.</p><div class="scroll"><table><thead><tr><th>Merchant</th><th>Date</th><th class="num">Amount</th></tr></thead><tbody>
    ${top.map(t => `<tr title="${esc(t.desc)}"><td class="clip">${who(t.merchant, t.cat)}</td><td class="dim">${dName(t.date)}</td><td class="num neg">${cents(-t.amt)}</td></tr>`).join("")}</tbody></table></div></div></div>`;
  drillDown(V);
}

function savings() {
  const months = rangeMonths(), tx = selected(), rows = monthly(tx, months);
  const done = completed(rows), inc = sum(done, r => r.income), sp = sum(done, r => r.spending);
  const scope = billed(rows), total = sum(scope, r => r.income - r.spending);
  const SAVED = "Savings & Investing";
  const moved = sum(tx.filter(t => t.cat === SAVED || (t.kind === "transfer" && ACCT[t.acct].type === "savings")), t => t.cat === SAVED ? -t.amt : t.amt);
  const savers = D.accounts.filter(a => a.type === "savings" && S.accts.has(a.index));
  const held = savers.filter(a => a.balance !== null);
  const nets = scope.map(r => Math.round((r.income - r.spending) * 100) / 100);
  let run = 0; const cumulative = nets.map(n => run += n);
  const withBal = D.accounts.filter(a => S.accts.has(a.index) && Object.keys(a.balances).length);
  const balSeries = withBal.slice(0, 8).map((a, i) => ({name: a.name, color: CSS("c" + i), values: months.map(m => m in a.balances ? a.balances[m] : null)}));
  V.innerHTML = `<div class="tiles">${tile("Kept this period", money(total), "income minus spending" + (scope.length < rows.length ? ", from " + mName(scope[0].month) : ""), tone(total))}
      ${tile("Savings rate", inc > 0 ? Math.round((inc - sp) / inc * 100) + "%" : "n/a", periodNote(rows) ? "complete months" : "", tone(inc - sp))}
      ${tile("Moved to savings and investing", money(moved), "net of withdrawals", tone(moved))}
      ${held.length ? tile("Savings balance", money(sum(held, a => a.balance)), "as of latest export", tone(sum(held, a => a.balance))) : ""}</div>
    <div class="charts pair"><div class="card"><h2>Kept each month</h2><p class="sub">Income minus spending. Red months spent more than came in.${scope.length < rows.length ? " Months before your checking history are left out." : ""}</p><div class="chart" id="c1"></div></div>
    <div class="card"><h2>Running total kept</h2><div class="chart" id="c2"></div></div></div>
    ${balSeries.length ? `<div class="card"><h2>Account balances</h2><p class="sub">Month-end balances. Exports supply some; the rest are calculated from a balance you entered.</p>${legend(balSeries)}<div class="chart" id="c3"></div></div>` : ""}`;
  bars(document.getElementById("c1"), {months: scope.map(r => r.month), series: [{name: "Kept", colorFor: v => v < 0 ? CSS("neg") : CSS("income"), values: nets}]});
  lines(document.getElementById("c2"), {months: scope.map(r => r.month), series: [{name: "Running total", color: CSS(run < 0 ? "neg" : "income"), values: cumulative}]});
  if (balSeries.length) lines(document.getElementById("c3"), {months, series: balSeries});
}

  const net = cash + sum(D.accounts.filter(a => a.type === "credit" && a.balance !== null), a => a.balance);
  V.innerHTML = `<div class="tiles">${banked.length ? tile("Cash and savings", money(cash), `${banked.length} of ${D.accounts.filter(a => a.type !== "credit").length} accounts`, tone(cash)) : ""}
      ${owedTile()}${banked.length && owedTile() ? tile("Net of cards", money(net), "cash and savings minus cards", tone(net)) : ""}</div>
    <div class="tools app-only">
      <button class="btn" data-act="export">${icon(SHEET)}Export workbook</button>
      <button class="btn" data-act="folder">${icon(FOLDER)}Open data folder</button>
    </div>
    ${noticeBar(D.checks.filter(c => c.level === "warning"))}
    ${syncCard()}
    <div class="accounts-grid"><div class="card"><h2>Accounts</h2><div class="scroll"><table><thead><tr><th>Account</th><th>Type</th><th>History</th><th class="num">Rows</th><th class="num">Latest balance</th><th class="app-only"></th></tr></thead><tbody>
    ${D.accounts.map(a => `<tr><td><div class="who">${mono(a.bank, CSS(a.type === "credit" ? "c1" : a.type === "savings" ? "c2" : "c0"))}<span>${esc(a.name)}</span></div></td><td class="dim">${a.type === "credit" ? "Credit card" : a.type[0].toUpperCase() + a.type.slice(1)}</td><td class="dim">${a.first ? spanName(a.first, a.last) : "No recent activity"}</td><td class="num">${a.count.toLocaleString()}</td><td class="num ${a.balance === null ? "" : tone(a.balance)}">${a.balance === null ? '<span class="dim">not set</span>' : cents(a.balance)}${a.calculated ? `<div class="dim">${a.live ? "from your bank" : "calculated"}, ${dName(a.balanceAsOf)}</div>` : ""}</td><td class="app-only"><div class="row-actions"><button class="btn small" data-act="edit" data-id="${esc(a.id)}">Edit</button><button class="btn small danger-text" data-act="drop-account" data-id="${esc(a.id)}">Remove</button></div></td></tr>`).join("")}</tbody></table></div></div>
    <div class="card"><h2>Recent imports</h2><div class="scroll"><table><thead><tr><th>File</th><th>Account</th><th>Covers</th><th class="num">New</th><th class="num">Had</th><th class="app-only"></th></tr></thead><tbody>
    ${D.imports.map(i => `<tr><td class="clip" title="${esc(i.file)}">${esc(i.file)}</td><td class="dim clip">${esc(i.account)}</td><td class="dim">${spanName(i.first, i.last)}</td><td class="num">${i.added}</td><td class="num">${i.duplicates}</td><td class="app-only"><div class="row-actions"><button class="btn small danger-text" data-act="drop-import" data-id="${esc(i.key)}" data-file="${esc(i.file)}" data-rows="${esc(i.added)}">Remove</button></div></td></tr>`).join("")}</tbody></table></div></div></div>
    ${D.checks.length ? `<div class="card"><h2>Worth checking</h2><p class="sub">Things that could make the numbers wrong.</p>${checksHtml(D.checks)}</div>` : ""}`;
}

function transactions() {
  V.innerHTML = `<div class="card"><div class="controls"><input type="search" id="q" placeholder="Search merchant or description" value="${esc(S.txq)}">
      <select id="cat"><option value="">All categories</option><option${S.txcat === "Transfer" ? " selected" : ""}>Transfer</option><option${S.txcat === "Savings & Investing" ? " selected" : ""}>Savings &amp; Investing</option><option${S.txcat === "Income" ? " selected" : ""}>Income</option>

function txTable() {
  const q = S.txq.toLowerCase();
  const list = selected().filter(t => (!S.txcat || t.cat === S.txcat) && (!S.txkind || t.kind === S.txkind) && (!q || (t.desc + " " + t.merchant).toLowerCase().includes(q)));
  const key = {date: t => t.date, merchant: t => t.merchant.toLowerCase(), cat: t => t.cat, amt: t => t.amt, acct: t => ACCT[t.acct].name}[S.txsort];
  list.sort((a, b) => (key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0) * S.txdir);
  document.getElementById("count").textContent = `${list.length.toLocaleString()} transactions, net ${cents(sum(list, t => t.amt))}`;
  const th = (k, n, c = "") => `<th data-sort="${k}" class="${c}">${n}${S.txsort === k ? (S.txdir > 0 ? " ▲" : " ▼") : ""}</th>`;
  const box = document.getElementById("tx");
  box.innerHTML = `<table><thead><tr>${th("date", "Date")}${th("merchant", "Merchant")}${th("cat", "Category")}${th("acct", "Account")}${th("amt", "Amount", "num")}</tr></thead><tbody>
    ${list.slice(0, S.txshow).map(t => `<tr title="${esc(t.desc)}" data-tx="${t.i}"><td class="dim">${dName(t.date)}</td><td class="clip">${who(t.merchant, t.cat)}</td><td>${chip(t.cat)}</td><td class="dim clip">${esc(ACCT[t.acct].name)}</td><td class="num ${tone(t.amt)}">${t.amt > 0 ? "+" : ""}${cents(t.amt)}</td></tr>`).join("")}</tbody></table>
    ${list.length > S.txshow ? '<button class="btn more" id="more">Show more</button>' : ""}${list.length ? "" : '<p class="empty">No transactions match.</p>'}`;
  box.querySelectorAll("[data-sort]").forEach(n => n.onclick = () => {
    if (S.txsort === n.dataset.sort) S.txdir *= -1; else { S.txsort = n.dataset.sort; S.txdir = n.dataset.sort === "date" ? -1 : 1; }
    txTable(); });
  const more = document.getElementById("more");
  if (more) more.onclick = () => { S.txshow += 500; txTable(); };
}

/* ---------- budgets ---------- */
const UNBUDGETED = ["Income", "Transfer", "Savings & Investing", "Card Payments (no detail)", "Uncategorized"];
const B = D.budgets || {targets: [], months: []};
const budgetChoices = () => [...new Set([...(D.allCategories || []), ...D.categories])].filter(c => !UNBUDGETED.includes(c) && !B.targets.some(t => t.category === c)).sort();
const completeMonths = () => { const c = B.months.filter(m => !m.partial).slice(-6); return c.length ? c : B.months; };
const budgetGoal = t => t.mode === "percent" ? `${t.value}% of income` : `${money(t.value)} a month`;
function budgetRow(t, m) {
  const goal = m.targets[t.category] || 0, spent = m.spent[t.category] || 0, left = goal - spent;
  const used = goal > 0 ? spent / goal : spent > 0 ? 2 : 0, state = used > 1 ? "over" : used >= .9 ? "near" : "";
  return `<div class="budget"><div>${chip(t.category)}<div class="goal">${esc(budgetGoal(t))}</div></div>
    <div><div class="left ${left < 0 ? "neg" : "pos"}">${money(Math.abs(left))} ${left < 0 ? "over" : "left"}</div><div class="used">${money(spent)} of ${money(goal)}</div></div>
    <div class="meter" role="img" aria-label="${Math.round(used * 100)}% used"><i class="${state}" style="width:${Math.min(Math.max(used, 0), 1) * 100}%"></i></div>
    <div class="row-actions"><button class="btn small" data-act="budget-edit" data-cat-name="${esc(t.category)}">Edit</button><button class="btn small danger-text" data-act="budget-delete" data-cat-name="${esc(t.category)}">Remove</button></div></div>`;
}
function budgetHistory(months) {
  return `<div class="card"><h2>Recent months</h2><p class="sub">What you spent in each category. Amounts in red went over that month's target.</p>
    <div class="scroll"><table><thead><tr><th>Category</th>${months.map(m => `<th class="num">${mName(m.month, false)}</th>`).join("")}</tr></thead><tbody>
    ${B.targets.map(t => `<tr><td>${chip(t.category)}</td>${months.map(m => { const v = m.spent[t.category] || 0; return `<td class="num ${v > (m.targets[t.category] || 0) ? "missed" : ""}">${v ? short(v) : ""}</td>`; }).join("")}</tr>`).join("")}
    </tbody></table></div></div>`;
}
function budgets() {
  const add = `<button class="btn primary" data-act="budget-new">${icon(PLUS)}Add budget</button>`;
  if (!B.targets.length) {
    V.innerHTML = `<div class="card"><h2>Set your first budget</h2><p class="sub">Choose a category and give it a monthly target: a dollar amount, or a percent of your income. Budgetier shows what's left each month.</p>${add}</div>`;
    return;
  }
  const m = B.months.find(x => x.month === S.budgetMonth) || B.months[B.months.length - 1];
  const goal = sum(B.targets, t => m.targets[t.category] || 0), spent = sum(B.targets, t => m.spent[t.category] || 0), left = goal - spent;
  const budgeted = new Set(B.targets.map(t => t.category));
  const other = sum(Object.entries(m.spent).filter(([c]) => !budgeted.has(c)), e => e[1]);
  const share = t => (m.spent[t.category] || 0) / (m.targets[t.category] || 1);
  const rows = B.targets.slice().sort((a, b) => share(b) - share(a));
  const uses = B.targets.some(t => t.mode === "percent");
  const note = m.partial ? `Month in progress, data through ${dName(D.end)}.${uses ? ` Percent targets use your recent income, ${money(m.base)} a month, until the month is complete.` : ""}`
    : uses ? `Percent targets use this month's income of ${money(m.base)}.` : "";
  V.innerHTML = `<div class="budget-head"><select id="budgetMonth" aria-label="Month">${B.months.slice().reverse().map(x => `<option value="${x.month}"${x === m ? " selected" : ""}>${mName(x.month)}</option>`).join("")}</select>${add}</div>
    <div class="tiles">
      ${tile("Budgeted", money(goal), m.base > 0 ? `${Math.round(goal / m.base * 100)}% of income` : "")}
      ${tile("Spent on budgets", money(spent), "", "neg")}
      ${tile(left < 0 ? "Over budget" : "Left to spend", money(Math.abs(left)), m.partial ? "so far this month" : "", left < 0 ? "neg" : "pos")}
      ${tile("Not budgeted", money(other), "other spending this month")}
    </div>
    <div class="card"><h2>${esc(mName(m.month))}</h2>${note ? `<p class="sub">${esc(note)}</p>` : ""}${rows.map(t => budgetRow(t, m)).join("")}</div>
    ${budgetHistory(B.months.slice(-6))}`;
  document.getElementById("budgetMonth").onchange = e => { S.budgetMonth = e.target.value; render(); };
}
function budgetForm(t) {
  const cats = t ? [t.category] : budgetChoices();
  if (!cats.length) return toast("Every category already has a budget.");
  showModal(t ? "Edit budget" : "Add budget", "Targets apply to every month, including past ones.", `<div class="fields">

      <label class="field">Target type<select id="bMode"><option value="amount"${t && t.mode === "amount" ? " selected" : ""}>Dollar amount</option><option value="percent"${t && t.mode === "percent" ? " selected" : ""}>Percent of income</option></select></label>

    </div><div class="panel" id="bPreview" aria-live="polite"></div>`,
    `<button class="btn" data-modal="close">Cancel</button><button class="btn primary" data-modal="budget-save">Save</button>`);

function budgetPreview() {
  const v = id => document.getElementById(id).value, mode = v("bMode"), months = completeMonths();
  document.querySelector("#bLabel span").textContent = mode === "percent" ? "Percent of income" : "Dollars a month";
  const n = months.length || 1, income = sum(months, m => m.income) / n, avg = sum(months, m => m.spent[v("bCat")] || 0) / n;
  const amount = parseFloat(v("bValue").replace(/[$,]/g, "")), lines = [`You've averaged <b>${money(avg)}</b> a month here, and earned ${money(income)} a month.`];
  if (mode === "percent" && amount > 0) lines.push(`${amount}% of that income is about <b>${money(income * amount / 100)}</b> a month.`);
  if (mode === "amount" && amount > 0 && income > 0) lines.push(`That's about <b>${Math.round(amount / income * 100)}%</b> of your income.`);
  document.getElementById("bPreview").innerHTML = lines.join(" ");
}
async function saveBudget() {
  const v = id => document.getElementById(id).value;
  const done = await api().save_budget(v("bCat"), v("bMode"), v("bValue"));

/* ---------- rules ---------- */
const ruleChoices = () => [...new Set([...(D.allCategories || []), ...D.categories])].filter(c => c !== "Uncategorized" && c !== "Card Payments (no detail)").sort();
async function categorize(merchant, desc, category) {
  const descriptions = [...new Set([desc, ...TX.filter(t => t.merchant === merchant).map(t => t.desc)])];
  const found = await api().suggest_rule(merchant, descriptions);
  ruleForm({text: found.ok ? found.text : "", merchant, category, desc});
}
function ruleForm(o) {
  const cats = ruleChoices(), known = cats.includes(o.category);
  showModal(o.line ? "Edit rule" : "Categorize", o.line ? "" : "Applies to every matching transaction, past and future.", `<div class="fields">
      ${o.desc ? `<div class="field full">The bank's description<span class="dim code">${esc(o.desc)}</span></div>` : ""}
      <label class="field full">When the bank's description contains<input id="rMatch" value="${esc(o.text)}" autocomplete="off"${o.advanced ? ' class="code"' : ""}></label>
      <label class="field">Show as<input id="rName" value="${esc(o.merchant)}" placeholder="Name to display" autocomplete="off"></label>
      <label class="field">Category<select id="rCat"><option value="">Choose...</option>${cats.map(c => `<option${c === o.category ? " selected" : ""}>${esc(c)}</option>`).join("")}<option value="__new"${o.category && !known ? " selected" : ""}>New category...</option></select></label>
      <label class="field full" id="rNewBox"${o.category && !known ? "" : " hidden"}>New category name<input id="rNew" value="${o.category && !known ? esc(o.category) : ""}" autocomplete="off"></label>
    </div><div class="panel" id="rPreview" aria-live="polite"></div>`,
    `<button class="btn" data-modal="close">Cancel</button><button class="btn primary" data-modal="rule-save">Save</button>`);
  modal.dataset.rule = o.line || "";
  modal.dataset.advanced = o.advanced ? "1" : "";
  const run = () => { clearTimeout(ruleForm.t); ruleForm.t = setTimeout(previewRule, 180); };
  document.getElementById("rMatch").oninput = run;
  document.getElementById("rCat").onchange = e => { document.getElementById("rNewBox").hidden = e.target.value !== "__new"; previewRule(); };

}
async function previewRule() {
  const box = document.getElementById("rPreview"), text = document.getElementById("rMatch").value;

  if (!r.count) { box.innerHTML = `<b>No transactions match yet.</b><p class="sub">Rules look for this exact text in the bank's description, which can differ from the name shown. Select a row on the Transactions tab to start from the bank's wording.</p>`; return; }
  const cat = document.getElementById("rCat").value;
  box.innerHTML = `<b>${r.count.toLocaleString()} transaction${r.count === 1 ? "" : "s"}</b> ${r.count === 1 ? "matches" : "match"}, totalling ${cents(r.total)}.${r.share > .25 ? '<span class="warn">That is a lot of your history. Try more specific text.</span>' : ""}${cat === "Transfer" ? '<span class="warn">Transfers don\'t count as spending or income.</span>' : ""}${r.examples.length ? `<ul>${r.examples.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}`;
}
async function saveRule() {
  const v = id => document.getElementById(id).value, choice = v("rCat");
