name: Platform check

# CI runs on Linux. This tests and builds a branch on Windows or a Mac when you want to know
# sooner than the next release. Run it from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      os:
        description: Where to run it
        type: choice
        options: [macos-latest, windows-latest]
        default: macos-latest

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Build installer
        run: python packaging/build_installer.py

      - name: Open the built app
        run: python packaging/self_check.py

      - name: Keep the installer for testing
        uses: actions/upload-artifact@v4
        with:
          name: Budgetier-${{ runner.os }}
          path: |
            dist/Budgetier-Windows.exe
            dist/Budgetier-*.dmg
          retention-days: 7
          if-no-files-found: error
