name: Platform check

# CI runs on Linux. This tests and builds a branch on Windows or a Mac when you want to know
# sooner than the next release. Run it from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      os:
        description: Where to run it
        type: choice
        options: [macos-latest, windows-latest]
        default: macos-latest

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ inputs.os }}
      artifact: Budgetier-${{ inputs.os }}
      retention: 7
