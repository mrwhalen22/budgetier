name: Build

# The one way an installer is made: test, build, open the built app on fake data, keep it.
# CI, Release, Mac builds and Platform check all call this, each with the system it wants.

on:
  workflow_call:
    inputs:
      os:
        description: The runner, like windows-latest
        type: string
        required: true
      ref:
        description: What to check out; the caller's commit if empty
        type: string
        default: ""
      tests:
        description: Run the tests first
        type: boolean
        default: true
      artifact:
        description: The name to keep the installer under
        type: string
        required: true
      retention:
        description: Days to keep it
        type: number
        default: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install what a Linux build needs
        if: runner.os == 'Linux'
        run: sh packaging/linux_deps.sh

      - name: Run tests
        if: inputs.tests
        env:
          BUDGETIER_QT: required  # the window's tests draw offscreen, so they can't quietly skip
        run: python -m unittest discover -s tests -t .

      - name: Build installer
        run: python packaging/build_installer.py

      - name: Open the built app
        run: python packaging/self_check.py

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            dist/Budgetier-Windows.exe
            dist/Budgetier-Linux.tar.gz
            dist/Budgetier-*.dmg
          retention-days: ${{ inputs.retention }}
          if-no-files-found: error
