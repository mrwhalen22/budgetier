name: CI

# Linux only: it's cheap, and closest to a Mac. Windows is tested by hand, and every system
# is built at release. Platform check runs a branch on Windows or a Mac when that can't wait.

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          sh packaging/linux_deps.sh

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        env:
          BUDGETIER_QT: required  # the window's tests draw offscreen, so they can't quietly skip
        run: python -m unittest discover -s tests -t .

  build:
    uses: ./.github/workflows/build.yml
    with:
      os: ubuntu-22.04  # the oldest we support: a Linux build only runs on the same or newer
      tests: false  # the test job has
      artifact: Budgetier-Linux
      retention: 7
