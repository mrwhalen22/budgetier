name: CI

# Windows only, because Mac runners cost far more. Mac CI covers changes that can behave
# differently on a Mac.

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Install browsers for the page tests
        run: python -m playwright install chromium webkit

      - name: Run tests
        env:
          BUDGETIER_BROWSERS: required  # so the page tests can't quietly stop running
        run: python -m unittest discover -s tests -t .

      - name: Build installer
        run: python packaging/build_installer.py

      - name: Open the built app
        run: python packaging/self_check.py

      - name: Keep the installer for testing
        uses: actions/upload-artifact@v4
        with:
          name: Budgetier-Windows
          path: dist/Budgetier-Windows.exe
          retention-days: 7
          if-no-files-found: error
