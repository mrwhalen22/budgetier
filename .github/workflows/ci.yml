name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Build installer
        run: python packaging/build_installer.py

      - name: Open the built app
        run: python packaging/self_check.py

      - name: Keep the installer for testing
        uses: actions/upload-artifact@v4
        with:
          name: Budgetier-${{ runner.os }}
          path: |
            dist/Budgetier-Windows.exe
            dist/Budgetier-*.dmg
          retention-days: 7
          if-no-files-found: error
