name: Release

# Run this from the Actions tab. It merges develop into main, raises the version, tests
# and builds on every system, then publishes the installers. The candidate waits on a
# release/vX.Y.Z branch, so a failed run leaves main and develop as they were.
#
# RELEASE_TOKEN is needed when a release includes changes to these workflow files, and if
# main is a protected branch. It must be allowed to push to main and to change workflows.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release

env:
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Merge develop into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          if git merge-base --is-ancestor origin/develop HEAD; then
            echo "::error::develop has nothing new to release."
            exit 1
          fi
          git merge --no-ff origin/develop -m "Merge develop into main"

      - name: Raise the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(python3 packaging/bump_version.py "$BUMP")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          git add VERSION
          git commit -m "Release v$version"
          git push origin "HEAD:refs/heads/release/v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v${{ needs.prepare.outputs.version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest tests.test_budgetier

      - name: Build installer
        run: python packaging/build_installer.py

      - name: Open the built app
        if: runner.os == 'macOS'
        run: python packaging/self_check.py

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/Budgetier-Windows.exe
            dist/Budgetier-*.dmg
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v${{ needs.prepare.outputs.version }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Push main and the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Budgetier $VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"

      - name: Publish the release
        run: |
          (cd installers && sha256sum * > SHA256SUMS.txt)
          gh release create "v$VERSION" installers/* \
            --title "Budgetier $VERSION" --generate-notes --verify-tag

      - name: Bring develop up to date
        run: |
          git fetch origin develop main
          git checkout -B develop origin/develop
          git merge --no-edit origin/main
          git push origin develop

  clean-up:
    needs: [prepare, build, publish]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove the release branch
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release/v$VERSION"
