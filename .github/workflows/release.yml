name: Release

# Run this from the Actions tab. It merges develop into main, raises the version,
# tests and builds, then publishes the installer. Nothing is pushed until the tests and
# the build have passed, so a failed run leaves main and develop as they were.
#
# If main is a protected branch, add a RELEASE_TOKEN secret that is allowed to push to it.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Merge develop into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          if git merge-base --is-ancestor origin/develop HEAD; then
            echo "::error::develop has nothing new to release."
            exit 1
          fi
          git merge --no-ff origin/develop -m "Merge develop into main"

      - name: Raise the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(python packaging/bump_version.py "$BUMP")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          git add VERSION
          git commit -m "Release v$version"
          git tag -a "v$version" -m "Budgetier $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest tests.test_budgetier

      - name: Build installer
        run: |
          python packaging/build_installer.py
          (cd dist && sha256sum BudgetierSetup.exe > BudgetierSetup.exe.sha256)

      - name: Push main and the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git push --atomic origin HEAD:main "refs/tags/v$VERSION"

      - name: Publish the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/BudgetierSetup.exe dist/BudgetierSetup.exe.sha256 \
            --title "Budgetier $VERSION" --generate-notes --verify-tag

      - name: Bring develop up to date
        run: |
          git fetch origin develop
          git checkout -B develop origin/develop
          git merge --no-edit origin/main
          git push origin develop
