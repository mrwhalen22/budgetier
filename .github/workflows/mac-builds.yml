name: Mac builds

# Adds the Mac installers to a published release. Release runs this unless you untick
# "Build for Mac". Run it from the Actions tab to add them to a release later.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release to add them to, like 1.4.2
        type: string
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: mac-builds-${{ inputs.version }}

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      ref: v${{ inputs.version }}
      artifact: installer-${{ matrix.os }}

  add-to-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Add them to the release
        run: |
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir before
          grep -v "Budgetier-macOS-" before/SHA256SUMS.txt > SHA256SUMS.txt || true
          (cd installers && sha256sum *) >> SHA256SUMS.txt
          # Checksums first: the app only offers an update once its installer is there.
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          gh release upload "$TAG" installers/* --clobber
